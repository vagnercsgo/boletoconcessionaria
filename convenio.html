<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convênio / Arrecadação</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <a class="back-link" href="index.html">← Início</a>
      <h1>Convênio / Arrecadação</h1>
      <p>Consulta e validação conforme o layout FEBRABAN de arrecadação/recebimento.</p>
    </header>

    <section class="card">
      <label for="entrada"><strong>Código ou representação numérica</strong></label>
      <textarea id="entrada" maxlength="60"
        placeholder="Ex.: 846700000009640000791007011172304427926098085687"></textarea>

      <div class="actions">
        <button onclick="consultarConvenio()">Consultar / Validar</button>
        <button class="btn-secondary" onclick="limparConvenio()">Limpar</button>
      </div>
    </section>

    <div id="resultado"></div>
  </main>

  <script src="js/comum.js"></script>
  <script src="js/convenio.js"></script>
</body>
</html>
